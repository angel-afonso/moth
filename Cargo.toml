[package]
name = "moth"
version = "0.2.0"
edition = "2024"
description = "A terminal for macOS, Linux and Windows that reads your shell, built with gpui and Zed's UI"
homepage = "https://angel-afonso.github.io/moth/"
repository = "https://github.com/angel-afonso/moth"
keywords = ["terminal", "terminal-emulator", "gpui", "shell"]
categories = ["command-line-utilities"]
publish = false
# Zed's `ui` crate is GPL-3.0-or-later; linking it makes the binary inherit that license.
license = "GPL-3.0-or-later"

[dependencies]
# gpui, ui and theme must come from the same Zed commit: `ui` has no published release.
gpui = { git = "https://github.com/zed-industries/zed", rev = "32b16ce2ada96ba86c9052e456a2642102b39b7a" }
ui = { git = "https://github.com/zed-industries/zed", rev = "32b16ce2ada96ba86c9052e456a2642102b39b7a" }
# `font-kit`: without it gpui draws no text on macOS. `runtime_shaders`: compiles the Metal shaders at startup (no Xcode Metal Toolchain needed).
# `x11` and `wayland`: the Linux display servers. Each feature only affects its own platform.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "32b16ce2ada96ba86c9052e456a2642102b39b7a", features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
theme = { git = "https://github.com/zed-industries/zed", rev = "32b16ce2ada96ba86c9052e456a2642102b39b7a" }
menu = { git = "https://github.com/zed-industries/zed", rev = "32b16ce2ada96ba86c9052e456a2642102b39b7a" }
# The same alacritty fork Zed uses at that commit.
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major version alacritty_terminal uses: needed to wrap its `Pty`.
polling = "3"
rust-embed = { version = "8", features = ["include-exclude"] }
# To see what gpui reports (renderer and platform failures) instead of dropping it.
log = "0.4"
# The updater (src/update): the release manifest over HTTPS, its version, and the checksum and
# minisign signature of every download.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
minisign-verify = "0.2"
semver = "1"
sha2 = "0.10"
thiserror = "2"
# The agent (src/agent.rs): an Agent Client Protocol client that launches the agent as a
# subprocess. `regex` finds the secrets taken out of what's sent to it (src/redact.rs).
agent-client-protocol = { version = "3.5", features = ["process"] }
regex = "1"
# The same image crate gpui uses, for the window icon on Linux (only PNG decoding).
image = { version = "0.25", default-features = false, features = ["png"] }

# To wake the shell with a signal when its folder's volume comes back (src/terminal.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Signs test archives with throwaway keys; the app itself only verifies.
minisign = "0.8"

[build-dependencies]
# Embeds the icon in moth.exe (Windows only; see build.rs).
embed-resource = "3"

# Zed's workspace [patch] entries aren't inherited by git dependencies; the ones gpui needs are copied here.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
debug = "limited"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
