# Link the C runtime into moth.exe (/MT), so Moth starts on Windows PCs without the Visual C++
# Redistributable. Release builds check its imports for the runtime's DLLs.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
