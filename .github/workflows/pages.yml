name: Pages

# Publishes the website in site/ to GitHub Pages. The site is plain HTML, CSS and JavaScript
# with relative paths, so the folder is uploaded as it is, with no build step. It runs when a
# push to main touches site/ (or this file), and by hand.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
