name: Release

# A push to main whose Cargo.toml version has no `v*` tag yet (the merged release-plz pull
# request) tags that version, builds Moth for macOS (one universal app for Apple Silicon and
# Intel), Linux and Windows, and publishes the downloads as a GitHub release. A `v*` tag pushed by hand does the same
# for that tag. Running it by hand from a branch only builds it and keeps the archives as
# workflow artifacts. The release pull request comes from the Release PR workflow, run by
# hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The app bundle reports the Cargo.toml version, so the release is tagged from it. Outputs
  # the version, the tag to publish (empty when nothing is released) and whether to build.
  version:
    name: Version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      # A tag pushed with the workflow's token starts no other run, so this run goes on to
      # build and publish it.
      - name: Tag the version
        id: tag
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::No version in [package] of Cargo.toml."
            exit 1
          fi
          echo "Cargo.toml version: $version"
          tag="" build=true
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $version; bump [package] version to ${GITHUB_REF_NAME#v} or tag v$version."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          elif [[ "$EVENT" == push ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "v$version is already released; nothing to build."
              build=false
            else
              tag="v$version"
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
              echo "Tagged $tag."
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  # Each Mac architecture compiles on its own; the macos-universal job merges them.
  build:
    name: Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The version comes from rust-toolchain.toml.
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The repository the app looks for updates in (`update::manifest_url`).
      - name: Build
        env:
          MOTH_REPOSITORY: ${{ github.repository }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Keep the binary
        run: |
          mkdir -p bin
          cp target/${{ matrix.target }}/release/moth bin/moth

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bin/
          if-no-files-found: error

  # One app for both Apple Silicon and Intel Macs: the two binaries merged with lipo into a
  # universal binary, which macOS runs natively on either.
  macos-universal:
    name: macOS universal app
    needs: [version, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*-apple-darwin
          path: bin

      - name: Universal binary
        run: |
          lipo -create -output moth \
            bin/bin-aarch64-apple-darwin/moth \
            bin/bin-x86_64-apple-darwin/moth
          chmod +x moth
          archs="$(lipo -archs moth)"
          echo "moth architectures: $archs"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "::error::The universal binary is missing an architecture: $archs"
            exit 1
          fi

      - name: Archive name
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG:-${GITHUB_SHA::7}}"
          echo "ARCHIVE=moth-$version-universal-apple-darwin" >> "$GITHUB_ENV"

      - name: App bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          .github/scripts/bundle-macos.sh moth "$VERSION" "dist/$ARCHIVE"
          cp README.md LICENSE "dist/$ARCHIVE/"

      # With the Apple secrets set, the app is signed with the Developer ID certificate,
      # notarized and stapled, so Gatekeeper opens it without a warning. Without them it
      # falls back to an ad-hoc signature (Apple Silicon refuses to run unsigned binaries)
      # and users have to right-click → Open the first time.
      - name: Sign and notarize
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          app="dist/$ARCHIVE/Moth.app"
          if [[ -z "$MACOS_CERTIFICATE" || -z "$APPLE_API_KEY" ]]; then
            echo "::warning::Apple signing secrets are not set; Moth.app gets an ad-hoc signature and is not notarized."
            codesign --force --deep --sign - "$app"
            exit 0
          fi

          # A throwaway keychain holding only the Developer ID certificate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Keep the existing keychains in the search list (their paths have no spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi

          # Notarization requires the hardened runtime and a secure timestamp.
          codesign --force --options runtime --timestamp --sign "$identity" "$app"
          codesign --verify --strict --verbose=2 "$app"

          # The installer step signs and notarizes the disk image with these.
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Moth-notarize.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/Moth-notarize.zip"

          # Staple the ticket so the app opens offline without asking Apple.
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Archive
        run: (cd dist && ditto -c -k --keepParent "$ARCHIVE" "$ARCHIVE.zip")

      # The installer: a disk image with Moth.app next to a link to /Applications, so
      # installing is dragging one onto the other. With the Apple secrets it is signed,
      # notarized and stapled like the app.
      - name: Installer
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          staging="$RUNNER_TEMP/dmg"
          dmg="dist/$ARCHIVE.dmg"
          mkdir -p "$staging"
          ditto "dist/$ARCHIVE/Moth.app" "$staging/Moth.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Moth -srcfolder "$staging" -fs HFS+ -format UDZO -ov "$dmg"

          if [[ -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "::warning::Apple signing secrets are not set; the disk image is not signed or notarized."
            exit 0
          fi
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
          .github/scripts/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  # Linux and Windows: the release build in one folder, packed as the archive users
  # download, then unpacked and opened the way a user would.
  package:
    name: Build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the binary runs on any distribution with glibc
          # 2.35 or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # NTFS and Defender scanning make Windows builds slow; a trusted ReFS Dev Drive avoids
      # both. The build runs in its copy of the checkout.
      - name: Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 30GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      # What gpui needs to link on Linux (X11, Wayland and fonts), then what opening the
      # download needs, as in CI: a virtual X server and window manager, a headless Wayland
      # compositor, Mesa's software Vulkan and screenshots.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev \
            imagemagick xvfb openbox sway grim mesa-vulkan-drivers vulkan-tools x11-utils

      - name: Workspace
        run: echo "WORKSPACE=${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      # The version comes from rust-toolchain.toml.
      - name: Toolchain
        working-directory: ${{ env.WORKSPACE }}
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKSPACE }}
          key: ${{ matrix.target }}

      # The repository the app looks for updates in (`update::manifest_url`).
      - name: Build
        working-directory: ${{ env.WORKSPACE }}
        env:
          MOTH_REPOSITORY: ${{ github.repository }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # .cargo/config.toml links the C runtime into moth.exe, so it starts on PCs without the
      # Visual C++ Redistributable. Runners have it installed, so only the import table shows
      # a build that needs it.
      - name: Check the C runtime is linked in
        if: runner.os == 'Windows'
        working-directory: ${{ env.WORKSPACE }}
        run: |
          rustup component add llvm-tools
          host="$(rustc -vV | sed -n 's/^host: //p')"
          readobj="$(cygpath -u "$(rustc --print sysroot)")/lib/rustlib/$host/bin/llvm-readobj.exe"
          imports="$("$readobj" --coff-imports target/${{ matrix.target }}/release/moth.exe | sed -n 's/^ *Name: //p')"
          echo "moth.exe imports:" $imports
          if grep -iE '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt)' <<< "$imports"; then
            echo "::error::moth.exe needs the Visual C++ runtime DLLs above; check .cargo/config.toml."
            exit 1
          fi

      - name: Archive name
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG:-${GITHUB_SHA::7}}"
          echo "ARCHIVE=moth-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      # moth/ holds the executable, its icon, a desktop entry and an install script that adds
      # them to the user's applications menu.
      - name: Linux archive
        if: runner.os == 'Linux'
        working-directory: ${{ env.WORKSPACE }}
        run: |
          folder="stage/moth"
          mkdir -p "$folder" dist
          cp target/${{ matrix.target }}/release/moth "$folder/moth"
          # Rust's release profile keeps the standard library's symbols.
          strip "$folder/moth"
          cp packaging/linux/moth.desktop packaging/linux/install.sh packaging/linux/README.txt LICENSE "$folder/"
          cp assets/branding/moth-256.png "$folder/moth.png"
          chmod 755 "$folder/moth" "$folder/install.sh"

          # What it needs from the system, and the newest glibc symbol it uses: the oldest
          # distribution it runs on.
          ldd "$folder/moth"
          glibc="$(objdump -T "$folder/moth" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "Newest glibc symbol: $glibc"
          echo "::notice::Linux build needs $glibc or newer"

          tar -C stage -czf "dist/$ARCHIVE.tar.gz" --owner=0 --group=0 moth
          tar -tzvf "dist/$ARCHIVE.tar.gz"

      # Moth/ holds moth.exe, which needs nothing else (it links the C runtime statically).
      - name: Windows archive
        if: runner.os == 'Windows'
        working-directory: ${{ env.WORKSPACE }}
        run: |
          folder="stage/Moth"
          mkdir -p "$folder" dist
          cp target/${{ matrix.target }}/release/moth.exe "$folder/moth.exe"
          cp packaging/windows/README.txt LICENSE "$folder/"
          (cd stage && 7z a -tzip -mx=9 "../dist/$ARCHIVE.zip" Moth >/dev/null)
          7z l "dist/$ARCHIVE.zip"

      # The download as a user gets it, unpacked into a fresh folder: the next steps open that
      # Moth, so a missing file shows here rather than on someone's computer.
      - name: Unpack the download
        working-directory: ${{ env.WORKSPACE }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            unpacked="$(cygpath -u "$RUNNER_TEMP")/unpacked"
            mkdir -p "$unpacked"
            7z x "dist/$ARCHIVE.zip" -o"$(cygpath -w "$unpacked")" >/dev/null
            app="$(cygpath -w "$unpacked/Moth/moth.exe")"
          else
            unpacked="$RUNNER_TEMP/unpacked"
            mkdir -p "$unpacked"
            tar -xzf "dist/$ARCHIVE.tar.gz" -C "$unpacked"
            app="$unpacked/moth/moth"
          fi
          ls -R "$unpacked"
          echo "DOWNLOAD_APP=$app" >> "$GITHUB_ENV"

      # Open it for 30 seconds, as CI opens its debug build; fails only if Moth quits before
      # then.
      - name: Launch the download (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ env.WORKSPACE }}
        run: .github/scripts/launch-linux.sh "$DOWNLOAD_APP" smoke

      - name: Launch the download (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.WORKSPACE }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:RUST_BACKTRACE = '1'
          $app = Start-Process $env:DOWNLOAD_APP -PassThru `
            -RedirectStandardOutput smoke\stdout.log -RedirectStandardError smoke\moth.log
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("smoke\screen.png")
          $exited = $app.HasExited
          if ($exited) { "exited with $($app.ExitCode)" | Add-Content smoke\moth.log } else { "still running" | Add-Content smoke\moth.log; Stop-Process $app }
          Get-Content smoke\stdout.log, smoke\moth.log
          if ($exited) { Write-Output "::error::The packaged Moth quit within 30 seconds of starting."; exit 1 }

      - name: Upload launch results
        if: ${{ !cancelled() && env.DOWNLOAD_APP != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: launch-${{ matrix.target }}
          path: ${{ env.WORKSPACE }}/smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.WORKSPACE }}/dist/*.tar.gz
            ${{ env.WORKSPACE }}/dist/*.zip
          if-no-files-found: error

  # Signs the archives the in-app updater installs and writes latest.json, which the app
  # reads from the latest release to find new versions.
  update-manifest:
    name: Update manifest
    needs: [version, macos-universal, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: moth-*
          path: dist
          merge-multiple: true

      - name: Sign and write latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            if [[ -n "$TAG" ]]; then
              echo "::error::UPDATE_SIGNING_KEY is not set; a release without signed updates would leave the updater nothing to install."
              exit 1
            fi
            echo "::warning::UPDATE_SIGNING_KEY is not set; no latest.json for this run."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          tag="${TAG:-${GITHUB_SHA::7}}"
          key="$RUNNER_TEMP/update.key"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          UPDATE_SIGNING_KEY_PATH="$key" .github/scripts/update-manifest.sh dist "$VERSION" "$tag" "$GITHUB_REPOSITORY"
          rm "$key"
          mkdir update
          mv dist/latest.json dist/*.minisig update/

      - uses: actions/upload-artifact@v4
        with:
          name: moth-update
          path: update/
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: needs.version.outputs.tag != ''
    needs: [version, macos-universal, package, update-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: moth-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Moth $TAG" \
            --generate-notes
